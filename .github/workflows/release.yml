name: Release

# Push a tag like v1.1.0 and this attaches a jex_lib.zip to the release.
# The zip contains a folder named jex_lib, so it drops straight into
# resources without anyone renaming anything.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches fxmanifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(grep -oP "version\s+'\K[^']+" jex_lib/fxmanifest.lua)
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match fxmanifest version $MANIFEST"
            exit 1
          fi

      - name: Build the zip
        run: zip -r jex_lib.zip jex_lib

      - uses: softprops/action-gh-release@v2
        with:
          files: jex_lib.zip
          generate_release_notes: true
